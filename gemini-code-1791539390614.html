<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support IT - Créer un ticket</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; display: flex; justify-content: center; padding: 40px 20px; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 12px; border: 1px solid #e2e8f0; width: 100%; max-width: 500px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { color: #2563eb; margin-top: 0; font-size: 1.5rem; }
    label { display: block; margin-top: 15px; font-weight: 600; font-size: 0.9rem; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    button { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; margin-top: 20px; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .alert { padding: 12px; background: #dcfce7; color: #166534; border-radius: 6px; margin-bottom: 15px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Créer une demande de support</h1>
    <div id="successAlert" class="alert">Votre ticket a bien été enregistré !</div>
    <form id="ticketForm">
      <label>Nom / Email</label>
      <input type="text" id="user" required placeholder="ex: jean.dupont@entreprise.com">
      
      <label>Catégorie du problème</label>
      <select id="category">
        <option>Matériel / PC</option>
        <option>Réseau / Wi-Fi / VPN</option>
        <option>Accès & Mots de passe</option>
        <option>Logiciel / Application</option>
      </select>

      <label>Priorité</label>
      <select id="priority">
        <option value="P3">Basse (P3)</option>
        <option value="P2" selected>Moyenne (P2)</option>
        <option value="P1">Haute / Bloquant (P1)</option>
      </select>

      <label>Sujet</label>
      <input type="text" id="subject" required placeholder="Description courte du problème">

      <label>Détails</label>
      <textarea id="description" rows="4" required placeholder="Expliquez votre problème..."></textarea>

      <button type="submit">Envoyer la demande</button>
    </form>
  </div>

  <script>
    document.getElementById('ticketForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const tickets = JSON.parse(localStorage.getItem('shared_it_tickets')) || [];
      const newTicket = {
        id: Math.floor(1000 + Math.random() * 9000),
        date: new Date().toLocaleDateString('fr-FR'),
        user: document.getElementById('user').value,
        category: document.getElementById('category').value,
        priority: document.getElementById('priority').value,
        subject: document.getElementById('subject').value,
        description: document.getElementById('description').value,
        status: 'Nouveau'
      };

      tickets.unshift(newTicket);
      localStorage.setItem('shared_it_tickets', JSON.stringify(tickets));

      document.getElementById('successAlert').style.display = 'block';
      e.target.reset();
      setTimeout(() => { document.getElementById('successAlert').style.display = 'none'; }, 4000);
    });
  </script>
</body>
</html>
